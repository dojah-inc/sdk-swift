name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Refresh simulator catalog
        run: xcrun simctl list > /dev/null

      - name: Select iOS Simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices[][] | select(.isAvailable == true) | select(.name | test("^iPhone"))]
            | (map(select(.name == "iPhone 16")) + map(select(.name == "iPhone 16 Pro")) + .)
            | .[0].udid // empty
          ')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme DojahWidget \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
